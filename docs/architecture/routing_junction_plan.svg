<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Junction plan: square tray and curved cable bundle</title>
  <desc id="desc">Illustrative top-down L junction with a 34-inch passage and a 24-inch cross-route. The bundle enters from west and leaves south. Two turn-start insets, 2 inches and 7 inches, resolve to a 10-inch centerline radius. The tray outline has square corners.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#526174"/></marker>
    <marker id="flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1260c4"/></marker>
    <style>
      text { font-family: system-ui, sans-serif; fill: #233348; }
      .small { font-size: 14px; }
      .label { font-size: 16px; font-weight: 600; }
      .dim { fill: none; stroke: #526174; stroke-width: 1.3; marker-start: url(#arrow); marker-end: url(#arrow); }
      .guide { fill: none; stroke: #788797; stroke-width: 1; stroke-dasharray: 4 4; }
      .leader { fill: none; stroke: #526174; stroke-width: 1.3; }
    </style>
  </defs>
  <rect width="1000" height="620" rx="12" fill="#f8fafc"/>
  <text x="28" y="38" font-size="23" font-weight="700">Junction plan · square tray, curved bundle</text>
  <text x="28" y="65" class="small">Illustrative geometry only · no cable radius or clearance has been verified</text>

  <!-- 8 drawing units per inch; anchor C = (380, 270). -->
  <path d="M 44 134 H 476 V 558 H 284 V 406 H 44 Z" fill="#e6ebf0" stroke="#56677a" stroke-width="3"/>
  <rect x="284" y="134" width="192" height="272" fill="#e2edfb" stroke="#8a9cb1" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="312" y="160" class="small">Junction overlap</text>
  <path class="guide" d="M 44 270 H 414 M 380 220 V 558"/>
  <path class="guide" d="M 284 134 V 406 M 284 406 H 476"/>

  <!-- Constant 4-inch bundle envelope, with an exact quarter-circle centerline. -->
  <path d="M 44 270 H 300 A 80 80 0 0 1 380 350 V 558" fill="none" stroke="#94bff5" stroke-width="32"/>
  <path d="M 44 270 H 300 A 80 80 0 0 1 380 350 V 545" fill="none" stroke="#1260c4" stroke-width="4" marker-end="url(#flow)"/>
  <circle cx="300" cy="270" r="6" fill="#1260c4" stroke="white" stroke-width="2"/>
  <circle cx="380" cy="350" r="6" fill="#1260c4" stroke="white" stroke-width="2"/>
  <circle cx="380" cy="270" r="4" fill="#526174"/>
  <text x="393" y="260" class="label">C</text>

  <path class="dim" d="M 284 105 H 476"/>
  <path class="leader" d="M 284 115 V 128 M 476 115 V 128"/>
  <text x="380" y="95" text-anchor="middle" class="label">24 in cross-route</text>
  <path class="dim" d="M 16 134 V 406"/>
  <text transform="translate(31 220) rotate(-90)" text-anchor="middle" class="label">34 in passage</text>

  <path class="dim" d="M 284 218 H 300"/>
  <path class="leader" d="M 300 224 V 258 M 292 211 V 188 H 209"/>
  <text x="63" y="183" class="label">FROM inset: 2 in</text>
  <path class="dim" d="M 425 350 V 406"/>
  <path class="leader" d="M 391 350 H 420 M 432 379 H 506"/>
  <text x="495" y="370" class="label">TO inset</text>
  <text x="495" y="392" class="label">7 in</text>
  <path class="leader" d="M 300 350 H 380 M 300 350 V 270"/>
  <text x="209" y="338" class="small">R = 10 in</text>
  <path class="leader" d="M 274 334 H 288 L 300 350"/>

  <text x="63" y="245" class="small">FROM · West</text>
  <text x="396" y="530" class="small">TO · South</text>
  <path class="leader" d="M 284 406 L 245 452 H 84"/>
  <text x="64" y="477" class="label">Square tray corner</text>
  <text x="64" y="500" class="small">No tray radius</text>
  <text x="29" y="592" class="small">Blue envelope = one example bundle · dashed rectangle = default working area</text>

  <path d="M 580 90 V 558" stroke="#d5dde7"/>
  <text x="610" y="125" font-size="19" font-weight="700">Movement inputs</text>
  <text x="610" y="158" class="label">FROM placement + endpoint</text>
  <text x="610" y="183" class="small">turn_start_in = 2</text>
  <text x="610" y="219" class="label">TO placement + endpoint</text>
  <text x="610" y="244" class="small">turn_start_in = 7</text>
  <text x="610" y="282" class="label">Derived, not separately saved</text>
  <text x="610" y="307" class="small">Overlap: 24 × 34 in</text>
  <text x="610" y="332" class="small">Centerline radius: 10 in</text>
  <text x="610" y="357" class="small">Swept bundle occupation</text>
  <text x="610" y="400" class="label">Geometry check</text>
  <text x="610" y="425" class="small">12 − 2 = 17 − 7 = 10 in</text>
  <text x="610" y="450" class="small">Both tangent distances from C agree.</text>
  <text x="610" y="490" class="label">Physical checks remain separate</text>
  <text x="610" y="515" class="small">Minimum inner radius, local height,</text>
  <text x="610" y="539" class="small">crossings and support requirements.</text>
  <text x="790" y="592" class="small">Plan · East → · South ↓</text>
</svg>
