services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-dc-infra-graph-postgres
    environment:
      POSTGRES_DB: ai_dc_infra_graph
      POSTGRES_USER: ai_dc_infra_graph
      POSTGRES_PASSWORD: ai_dc_infra_graph_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_dc_infra_graph -d ai_dc_infra_graph"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
