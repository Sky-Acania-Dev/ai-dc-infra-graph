[project]
name = "ai-dc-infra-graph"
version = "0.1.0"
description = "Graph-based infrastructure topology platform for AI data center deployments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "networkx",
    "pandas",
    "matplotlib",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
